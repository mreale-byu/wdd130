<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/quiz.css">
    <title>Basic HTML and CSS Quiz</title>
</head>

<body>
    <main>
        <h1>☑️ Basic HTML and CSS Quiz</h1>
        <form action="" method="post">
            <div class="form-item">
                <label for="q1"><span>1.</span> What does the acronym CSS stands for?</label>
                <input type="text" id="q1" name="q1">
            </div>
            <div class="form-item">
                <label for="q2"><span>2.</span> How are id and class attributes selected in CSS?</label>
                <textarea id="q2" name="q2" rows="3"></textarea>
            </div>
            <div class="form-item">
                <label for="q3"><span>3.</span> Which of the following is a valid CSS comment?</label>
                <select name="q3" id="q3">
                    <option value="">Choose one...</option>
                    <option value="a">a) /* this is a comment */</option>
                    <option value="b">b) // this is a comment</option>
                    <option value="c">c) # this is a comment</option>
                    <option value="d">d) &lt;!-- this is a comment --&gt; </option>
                </select>
            </div>
            <div class="form-item">
                <label for="q4"><span>4.</span> What is the bottom margin given this declaration?</label>
                <p class="code-snippet">
                    margin: 10px 5px 15px;
                </p>
                <input type="text" id="q4" name="q4">
            </div>
            <div class="form-item">
               <input type="submit" value="Submit Quiz">
            </div>
        </form>
    </main>
</body>

</html>
