<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Contact Us. Reale's Rafting & Co offers unforgettable whitewater rafting experiences with professional guides and natural scenery.">
    <meta name="author" content="Mauricio">
    <link rel="stylesheet" href="styles/rafting.css">
    <title>Contact Us - Reale's Rafting & Co</title>
</head>

<body>
    <header>
        <img src="images/logo.png" alt="Reale's Rafting & Co logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <section class="address">
            <h1>Reale's Rafting & Co</h1>
            <span>9857, Emerald Bay Rd</span>
            <span>Lake Valley, CA 91150, USA</span>
            <span>+1 (999) 123-4567</span>
            <span>info@realesrafting-us.com</span>
        </section>
        <section>
            <div class="contact">
                <iframe class="contact-map"
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14765.175848249513!2d-120.01237357139757!3d38.92407211094776!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x80998f9182dcaee5%3A0x42879719a2fbc536!2sLake%20Valley%2C%20South%20Lake%20Tahoe%2C%20CA%2096150%2C%20EUA!5e0!3m2!1spt-BR!2sbr!4v1785719753174!5m2!1spt-BR!2sbr"
                  allowfullscreen="" loading="lazy"
                  referrerpolicy="strict-origin-when-cross-origin">
                </iframe>
                <form class="contact-form">
                    <div class="form-row">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" autocomplete="given-name"
                          placeholder="Inform the name" required>
                    </div>
                    <div class="form-row">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" autocomplete="email"
                          placeholder="Inform the email" required>
                    </div>
                    <div class="form-row">
                        <span>Message<br>Purpose</span>
                        <div class="radio-group">
                            <label for="purpose" class="radio-option">
                                <input type="radio" id="purpose" name="purpose" value="general"
                                  checked>
                                General Inquiry
                            </label>
                            <label class="radio-option">
                                <input type="radio" id="reservation" name="purpose"
                                  value="reservation">
                                Reservation Question
                            </label>
                            <label class="radio-option">
                                <input type="radio" id="suggestion" name="purpose"
                                  value="suggestion">
                                Website Suggestion
                            </label>
                        </div>
                    </div>
                    <div class="form-row full-width">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type your message here"
                          required></textarea>
                    </div>
                    <div class="form-row full-width">
                        <div>
                            <input type="checkbox" id="subscribe" name="subscribe">
                            <label for="subscribe">Please Subscribe me to the monthly
                                newsletter</label>
                        </div>

                    </div>
                    <div class="form-row full-width">
                        <button type="submit">Get in Touch!</button>
                    </div>
                </form>
            </div>
        </section>
        <section>
            <h2>We Are Here to Serve You</h2>
            <div class="adventure">
                <figure>
                    <img src="images/worker1.png" alt="Image representing Jeff" />
                    <figcaption>Jeff Cantarelli<br />Rafting Instructor</figcaption>
                </figure>
                <figure>
                    <img src="images/worker2.png" alt="Image representing Rachel" />
                    <figcaption>Rachel Muniz<br />Rafting Guide</figcaption>
                </figure>
                <figure>
                    <img src="images/worker3.png" alt="Image representing Josh" />
                    <figcaption>Tom Smith<br />Tour Manager</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer class="footer">
        <p>
            &copy; 2026 | Reale's Rafting & Co | Mauricio
        </p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook.png" alt="Facebook Icon">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin.png" alt="Linkedin Icon">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram.png" alt="Instagram Icon">
            </a>
        </nav>
    </footer>
</body>

</html>
